[package]
name = "argyph-locate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
smart = ["dep:reqwest", "dep:eventsource-stream"]

[dependencies]
argyph-store = { path = "../argyph-store", version = "=1.0.4" }
argyph-fs = { path = "../argyph-fs", version = "=1.0.4" }
argyph-parse = { path = "../argyph-parse", version = "=1.0.4" }
argyph-embed = { path = "../argyph-embed", version = "=1.0.4" }
argyph-graph = { path = "../argyph-graph", version = "=1.0.4" }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
camino = "1"
eventsource-stream = { version = "0.2", optional = true }
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
