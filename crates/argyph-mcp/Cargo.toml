[package]
name = "argyph-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
argyph-core = { path = "../argyph-core", version = "=1.0.4" }
argyph-pack = { path = "../argyph-pack", version = "=1.0.4" }
argyph-graph = { path = "../argyph-graph", version = "=1.0.4" }
argyph-parse = { path = "../argyph-parse", version = "=1.0.4" }
argyph-fs = { path = "../argyph-fs", version = "=1.0.4" }
argyph-store = { path = "../argyph-store", version = "=1.0.4" }
argyph-locate = { path = "../argyph-locate", version = "=1.0.4" }
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
camino = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-std"] }
regex = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lib]
name = "argyph_mcp"
path = "src/lib.rs"
