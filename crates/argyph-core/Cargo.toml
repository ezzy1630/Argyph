[package]
name = "argyph-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
argyph-fs = { path = "../argyph-fs", version = "=1.0.0-rc.1" }
argyph-graph = { path = "../argyph-graph", version = "=1.0.0-rc.1" }
argyph-parse = { path = "../argyph-parse", version = "=1.0.0-rc.1" }
argyph-embed = { path = "../argyph-embed", version = "=1.0.0-rc.1" }
argyph-pack = { path = "../argyph-pack", version = "=1.0.0-rc.1" }
argyph-store = { path = "../argyph-store", version = "=1.0.0-rc.1" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
camino = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lib]
name = "argyph_core"
path = "src/lib.rs"
