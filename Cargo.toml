[workspace]
resolver = "2"
members = [
    "crates/argyph",
    "crates/argyph-core",
    "crates/argyph-fs",
    "crates/argyph-parse",
    "crates/argyph-graph",
    "crates/argyph-embed",
    "crates/argyph-store",
    "crates/argyph-locate",
    "crates/argyph-pack",
    "crates/argyph-mcp",
    "crates/argyph-cli",
    "crates/argyph-memory",
    "benches",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ezzy1630/argyph"
homepage = "https://github.com/Ezzy1630/argyph"
documentation = "https://docs.rs/argyph"
readme = "README.md"
description = "Local-first MCP server giving AI coding agents fast, structured, and semantic context over any codebase."
keywords = ["mcp", "ai", "codebase", "semantic-search", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]
authors = ["Ezzy1630"]

[workspace.dependencies]
criterion = "0.8"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
