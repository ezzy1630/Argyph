name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  line-count:
    name: file line count <= 600
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check no .rs file exceeds 1500 lines
        # Soft modularity gate: most files should stay under ~600 lines, but
        # two crates legitimately exceed that today (argyph-store SQL backend
        # and Store trait + integration tests). The gate catches accidental
        # 2000-line megafiles while accepting the known boilerplate-heavy
        # outliers.
        run: |
          LONG_FILES=$(find . -path ./target -prune -o -name '*.rs' -type f -print \
            | xargs -I {} sh -c 'l=$(wc -l < "{}"); if [ "$l" -gt 1500 ]; then echo "{}: $l lines"; fi')
          if [ -n "$LONG_FILES" ]; then
            echo "==> Files exceeding 1500 lines <=="
            echo "$LONG_FILES"
            exit 1
          fi
          echo "All .rs files <= 1500 lines."

  clippy:
    name: clippy (${{ matrix.os }})
    needs: [fmt]
    runs-on: ${{ matrix.os }}
    # Windows is currently advisory-only: the prebuilt `ort` (ONNX
    # Runtime) library ships with the dynamic MSVC CRT (/MD) while a
    # transitive C++ dep (esaxx-rs via tokenizers) is compiled with the
    # static CRT (/MT), causing LNK2038 in the dev/test profile. The
    # release-profile binary built by cargo-dist is unaffected. Tracked
    # for resolution before v1.0.0 GA.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-

      - name: Fetch dependencies
        run: cargo fetch

      # On Windows, force C/C++ build scripts to use the dynamic CRT (/MD)
      # so they link against the same runtime as the prebuilt ort.dll.
      # No-op on macOS/Linux because the env vars are target-suffixed.
      - name: Force dynamic CRT on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "CFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: [fmt]
    runs-on: ${{ matrix.os }}
    # Windows is currently advisory-only: the prebuilt `ort` (ONNX
    # Runtime) library ships with the dynamic MSVC CRT (/MD) while a
    # transitive C++ dep (esaxx-rs via tokenizers) is compiled with the
    # static CRT (/MT), causing LNK2038 in the dev/test profile. The
    # release-profile binary built by cargo-dist is unaffected. Tracked
    # for resolution before v1.0.0 GA.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-test-

      - name: Fetch dependencies
        run: cargo fetch

      - name: Force dynamic CRT on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "CFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"

      - run: cargo test --workspace

  smart-e2e:
    name: smart e2e (opt-in)
    needs: [test]
    # All inputs below come from repo Variables/Secrets (admin-controlled).
    # No untrusted event payload data is interpolated into run: steps.
    if: ${{ vars.ARGYPH_SMART_E2E == '1' }}
    runs-on: ubuntu-latest
    env:
      ARGYPH_SMART_E2E: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run live-provider tests
        run: cargo test --workspace --features argyph-locate/smart -- --ignored smart_live
