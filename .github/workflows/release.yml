name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.xz
          # x86_64-apple-darwin: ort (ONNX Runtime) does not ship a
          # prebuilt binary for Intel Mac. Intel Mac users build from
          # source via `cargo install argyph`. We can re-enable this
          # target later by switching to the pure-Rust ort-tract
          # backend or compiling ONNX from source.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.xz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.xz
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target stdlib is installed
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install cross-compilation toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "%s"\n' "${{ matrix.linker }}" > .cargo/config.toml
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Force dynamic CRT (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "CFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS_x86_64_pc_windows_msvc=-MD" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target=${{ matrix.target }} -p argyph

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          STAGE="argyph-$TARGET"
          mkdir -p "$STAGE"
          cp "target/$TARGET/release/argyph" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$STAGE/" || true
          tar -cJf "${STAGE}.tar.xz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.xz" | awk '{print $1"  "$2}' > "${STAGE}.tar.xz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $stage = "argyph-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/argyph.exe" "$stage/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, CHANGELOG.md "$stage/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower() + "  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argyph-${{ matrix.target }}
          path: |
            argyph-${{ matrix.target }}.${{ matrix.archive_ext }}
            argyph-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: argyph-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          PRERELEASE_FLAG=""
          case "$REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" artifacts/* --clobber
          else
            gh release create "$REF_NAME" $PRERELEASE_FLAG \
              --title "$REF_NAME" \
              --notes "Argyph $REF_NAME — see CHANGELOG.md." \
              artifacts/*
          fi

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Ezzy1630/argyph' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          set -e
          for crate in argyph-fs argyph-parse argyph-graph argyph-embed argyph-store argyph-pack argyph-memory argyph-locate argyph-core argyph-mcp argyph-cli argyph; do
            echo "==> Publishing $crate"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || echo "    (already published or transient failure — continuing)"
            sleep 30
          done

  npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Ezzy1630/argyph' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
      - name: Sync version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          cd npm
          # VERSION must be in the environment of the node process itself —
          # a plain shell var is not visible via process.env.
          VERSION="$VERSION" node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          echo "npm/package.json version synced to $VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          cd npm
          if [[ "$REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

  dxt:
    name: Build DXT bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package DXT
        run: |
          cd dxt
          zip -r ../argyph.dxt manifest.json icon.png
      - uses: actions/upload-artifact@v7
        with:
          name: argyph-dxt
          path: argyph.dxt
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" argyph.dxt --clobber
          fi

  homebrew:
    name: Update Homebrew formula
    needs: github-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update SHAs in Formula/argyph.rb
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh "$REF_NAME"
      - name: Open PR with refreshed formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet Formula/argyph.rb; then
            echo "Formula already up to date — nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH="homebrew/${REF_NAME}"
          git checkout -b "$BRANCH"
          git add Formula/argyph.rb
          git commit -m "chore(homebrew): update SHAs for ${REF_NAME}"
          git push origin "$BRANCH" --force
          # main is a protected branch, so propose the change via PR
          # rather than pushing directly.
          gh pr create --base main --head "$BRANCH" \
            --title "chore(homebrew): update SHAs for ${REF_NAME}" \
            --body "Automated Homebrew formula SHA refresh for ${REF_NAME}." \
            || echo "PR already exists."
