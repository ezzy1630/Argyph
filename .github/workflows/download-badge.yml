name: Download badge

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update download badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test badge generator
        run: node --test scripts/update-download-badge.test.mjs

      - name: Update badge JSON
        run: node scripts/update-download-badge.mjs

      - name: Commit badge update
        run: |
          if git diff --quiet badges/downloads.json; then
            echo "Download badge is already current."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/downloads.json
          git commit -m "chore: update download badge"
          git push
