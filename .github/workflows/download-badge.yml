name: Download badge

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update download badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Test badge generator
        run: node --test scripts/update-download-badge.test.mjs

      - name: Update badge JSON
        run: node scripts/update-download-badge.mjs

      - name: Open badge update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: badges/downloads.json
          branch: automation/download-badge
          commit-message: 'chore: update download badge'
          title: 'chore: update download badge'
          body: 'Automated download badge refresh.'
          delete-branch: true
