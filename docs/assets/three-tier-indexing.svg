<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tier0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="tier1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tier15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" fill="url(#bg)" rx="12"/>

  <text x="32" y="44" fill="#e2e8f0" font-size="22" font-weight="700">Argyph — progressive three-tier indexing</text>
  <text x="32" y="68" fill="#94a3b8" font-size="13">Each tier is queryable before the next finishes. Tools degrade gracefully.</text>

  <!-- Timeline axis -->
  <line x1="60" y1="110" x2="860" y2="110" stroke="#334155" stroke-width="1"/>
  <line x1="60" y1="110" x2="60" y2="320" stroke="#334155" stroke-width="1"/>

  <text x="60" y="100" fill="#64748b" font-size="11">cold start</text>
  <text x="280" y="100" fill="#64748b" font-size="11">~1 s</text>
  <text x="500" y="100" fill="#64748b" font-size="11">~30 s</text>
  <text x="720" y="100" fill="#64748b" font-size="11">minutes (background)</text>

  <!-- Tier 0 -->
  <rect x="60" y="125" width="220" height="40" rx="6" fill="url(#tier0)"/>
  <text x="72" y="150" fill="#082f49" font-weight="700">Tier 0 · filesystem</text>
  <text x="290" y="151" fill="#cbd5e1" font-size="12">tree, search_text, pack_repo</text>

  <!-- Tier 1 -->
  <rect x="60" y="175" width="440" height="40" rx="6" fill="url(#tier1)"/>
  <text x="72" y="200" fill="#1e1b4b" font-weight="700">Tier 1 · symbol graph (tree-sitter)</text>
  <text x="510" y="201" fill="#cbd5e1" font-size="12">find_definition, find_references, callers, callees, outline</text>

  <!-- Tier 1.5 -->
  <rect x="60" y="225" width="540" height="40" rx="6" fill="url(#tier15)"/>
  <text x="72" y="250" fill="#500724" font-weight="700">Tier 1.5 · structural (md, json, yaml, toml, csv)</text>
  <text x="610" y="251" fill="#cbd5e1" font-size="12">locate, locate_smart</text>

  <!-- Tier 2 -->
  <rect x="60" y="275" width="800" height="40" rx="6" fill="url(#tier2)"/>
  <text x="72" y="300" fill="#451a03" font-weight="700">Tier 2 · BM25 + vector (bundled local embedder, no API key)</text>
  <text x="660" y="301" fill="#451a03" font-size="12">search_semantic, ask</text>

  <text x="32" y="345" fill="#64748b" font-size="11">Read-only · single binary · on-disk index in .argyph/ · live filesystem watcher</text>
</svg>
