[package]
name = "argyph-benches"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
argyph-fs = { path = "../crates/argyph-fs" }
argyph-parse = { path = "../crates/argyph-parse" }
argyph-pack = { path = "../crates/argyph-pack" }
argyph-locate = { path = "../crates/argyph-locate" }
argyph-store = { path = "../crates/argyph-store" }
argyph-core = { path = "../crates/argyph-core" }
camino = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "argyph_benches"
path = "src/lib.rs"

[dev-dependencies]
criterion.workspace = true
tempfile = "3"
walkdir = "2"
tiktoken-rs = "0.12"

[[bench]]
name = "core"
path = "core.rs"
harness = false

[[bench]]
name = "locate"
path = "locate.rs"
harness = false

[[bin]]
name = "system_bench"
path = "bin/system_bench.rs"
